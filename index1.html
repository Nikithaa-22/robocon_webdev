
<!DOCTYPE html>
<html>
<head>
    <title>Random Background Color</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #colorCode {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Random Background Color</h1>

    <button onclick="changeBackground()">
        Change Background
    </button>

    <p id="colorCode">Color: rgb(255, 255, 255)</p>


    <script>
        function changeBackground() {

            let r = Math.floor(Math.random() * 256);
            let g = Math.floor(Math.random() * 256);
            let b = Math.floor(Math.random() * 256);

            let color = `rgb(${r}, ${g}, ${b})`;

            document.body.style.backgroundColor = color;

            document.getElementById("colorCode").textContent =
                "Color: " + color;
        }
    </script>

</body>
</html>
